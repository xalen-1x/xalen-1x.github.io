<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitaliy Galachiev | Portfolio</title>
    <!-- Подключение шрифтов для эстетики кода -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --bg-card-hover: #1c2128;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            
            /* Цвета подсветки синтаксиса */
            --syntax-cyan: #58a6ff;
            --syntax-green: #3fb950;
            --syntax-purple: #bc8cff;
            --syntax-orange: #ffa657;
            --syntax-red: #ff7b72;
            --syntax-yellow: #d29922;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(rgba(88, 166, 255, 0.06) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            padding: 30px 20px;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        /* Окно терминала в шапке */
        .terminal-window {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            margin-bottom: 48px;
        }

        .terminal-header {
            background-color: #010409;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .terminal-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .terminal-body {
            padding: 28px 32px;
        }

        .cmd-line {
            color: var(--syntax-green);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .cmd-line span {
            color: var(--text-secondary);
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.3rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.9rem;
            background-color: var(--syntax-cyan);
            vertical-align: middle;
            margin-left: 6px;
            animation: blink 1.1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            color: var(--syntax-cyan);
        }

        .subtitle .comment {
            color: var(--text-secondary);
        }

        /* Необычные заголовки секций */
        section {
            margin-bottom: 48px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            font-family: 'JetBrains Mono', monospace;
        }

        .sec-index {
            background-color: rgba(88, 166, 255, 0.12);
            color: var(--syntax-cyan);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid rgba(88, 166, 255, 0.3);
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        h2 .fn { color: var(--syntax-purple); }
        h2 .str { color: var(--syntax-orange); }
        h2 .flag { color: var(--syntax-green); }

        /* Секция "О себе" в стиле JSON/Code блока */
        .code-block {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.92rem;
            overflow-x: auto;
        }

        .code-line {
            margin-bottom: 8px;
        }
        .code-line:last-child { margin-bottom: 0; }

        .indent { padding-left: 22px; }
        .key { color: var(--syntax-cyan); }
        .string { color: var(--syntax-orange); }
        .punct { color: var(--text-secondary); }

        .interest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .interest-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .interest-card:hover {
            border-color: var(--syntax-cyan);
            transform: translateY(-2px);
        }

        .interest-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
        }

        .interest-title svg {
            width: 18px;
            height: 18px;
            stroke: var(--syntax-cyan);
            flex-shrink: 0;
        }

        .interest-card p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .band-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 123, 114, 0.1);
            border: 1px solid rgba(255, 123, 114, 0.3);
            color: var(--syntax-red);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            margin-top: 6px;
            margin-right: 4px;
        }

        /* Навыки (Теги) */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .skill-tag {
            background-color: var(--bg-card);
            color: var(--text-primary);
            padding: 9px 16px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .skill-tag::before {
            content: "#";
            color: var(--syntax-green);
            font-weight: bold;
        }

        .skill-tag:hover {
            border-color: var(--syntax-green);
            background-color: var(--bg-card-hover);
        }

        /* Опыт и достижения (Git-лог стиль) */
        .timeline {
            position: relative;
            padding-left: 24px;
            border-left: 2px solid var(--border-color);
        }

        .card {
            position: relative;
            background-color: var(--bg-card);
            padding: 20px 24px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        .card:last-child {
            margin-bottom: 0;
        }

        .card:hover {
            border-color: var(--syntax-purple);
        }

        .card::before {
            content: "";
            position: absolute;
            left: -31px;
            top: 24px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--bg-main);
            border: 2px solid var(--syntax-purple);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .card h3 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            color: #fff;
        }

        .date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--syntax-green);
            background-color: rgba(63, 185, 80, 0.1);
            border: 1px solid rgba(63, 185, 80, 0.25);
            padding: 2px 10px;
            border-radius: 12px;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Контакты */
        .contacts-box {
            background-color: var(--bg-card);
